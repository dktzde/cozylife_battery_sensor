name: Upstream watch

# Weekly check whether soulripper13/cozylife_local changed code that matters
# for the battery sensor. Opens or updates one issue labelled "upstream-watch";
# GitHub then notifies the maintainer. Never pushes anything.

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: upstream-watch
  cancel-in-progress: false

jobs:
  watch:
    name: Upstream watch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Compare with upstream
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM: soulripper13/cozylife_local
        run: bash .github/scripts/upstream_watch.sh
