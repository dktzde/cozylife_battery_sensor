name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"

      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest pytest-timeout

      - name: Run unit tests (no Home Assistant needed)
        run: python -m pytest -q --timeout=60 tests

      - name: Compile integration
        run: python -m compileall -q custom_components/cozylife_local

  homeassistant:
    name: Home Assistant tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"

      - name: Install Home Assistant test harness
        run: python -m pip install --disable-pip-version-check pytest-homeassistant-custom-component

      - name: Run Home Assistant tests
        run: python -m pytest -q -p no:cacheprovider tests_ha

  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Check scripts
        run: shellcheck .github/scripts/*.sh
